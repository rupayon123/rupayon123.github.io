name: Preview current GTA frontend

# Isolated review deployment; no production or GitHub Pages publication.
on:
  push:
    branches: [codex/frontend-preview-20261110]
    paths: [.github/workflows/publish.yml]

permissions:
  contents: read

concurrency:
  group: gta-reviewed-preview
  cancel-in-progress: false

jobs:
  preview:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: app-source
    env:
      APP_COMMIT: dbd498d4cf62d26ef07f34697268c35fe32b192a
      EXPECTED_NATIVE_FEED_SHA256: b1bc634cf7be59ac0ecf0799f717f0726660978f2356e51d57fc55848635fc9b
      PREVIEW_BRANCH: review-frontend-20261110
      NEXT_TELEMETRY_DISABLED: '1'
      NODE_OPTIONS: --max-old-space-size=2048
    steps:
      - name: Require an immutable reviewed source
        working-directory: ${{ github.workspace }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = push
          test "$GITHUB_REF_NAME" = codex/frontend-preview-20261110
          test "${{ github.event.before }}" = a4c7fa1fb914a899c3b22f834b2002e0f74144ff
          [[ "$APP_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          test "$PREVIEW_BRANCH" != main
      - name: Check out the exact preview verification source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          path: preview-ops
          persist-credentials: false
      - name: Check out reviewed application source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: rupayon123/gta-free-stem-opportunities
          path: app-source
          ref: 8ff9803761c5d4e77aac8e48bd62b718762166e7
          persist-credentials: false
      - name: Reconstruct and verify the exact local review candidate
        shell: bash
        run: |
          set -euo pipefail
          patch_file="$GITHUB_WORKSPACE/preview-ops/.github/gta-visual/fresh-ui.patch.gz"
          printf '%s  %s\n' f0ad041643131186046c1c7845b10aa8899331dd9f2c55f99e298008f0e3e5c3 "$patch_file" | sha256sum -c -
          gzip -dc "$patch_file" > "$RUNNER_TEMP/fresh-ui.patch"
          printf '%s  %s\n' e98787d896e63e94e0a16f7ebce3b374f22fa4a67e1d73fd7ac365a878fea5f4 "$RUNNER_TEMP/fresh-ui.patch" | sha256sum -c -
          git apply --index "$RUNNER_TEMP/fresh-ui.patch"
          test "$(git write-tree)" = f7430426a890367ec3fc93a37261557cdebfc9bf
          export GIT_AUTHOR_NAME='GTA Frontend Review' GIT_AUTHOR_EMAIL='frontend-review@users.noreply.github.com'
          export GIT_COMMITTER_NAME='GTA Frontend Review' GIT_COMMITTER_EMAIL='frontend-review@users.noreply.github.com'
          export GIT_AUTHOR_DATE='2026-11-10T00:00:00Z' GIT_COMMITTER_DATE='2026-11-10T00:00:00Z'
          candidate="$(git commit-tree "$(git write-tree)" -p 8ff9803761c5d4e77aac8e48bd62b718762166e7 -m 'Prepare fresh-data website visual review')"
          test "$candidate" = ab3674f84b89c8603d39cda1edc2b5e5aff5bcf0
          git reset --hard "$candidate"
          printf '%s  %s\n' 207b7a78691f5d8189c98b9159a7da5426cfd665554a24314343b80b0035e6c6 "$GITHUB_WORKSPACE/preview-ops/.github/gta-visual/browse-sort-i18n-followup.patch" | sha256sum -c -
          git apply --index "$GITHUB_WORKSPACE/preview-ops/.github/gta-visual/browse-sort-i18n-followup.patch"
          test "$(git write-tree)" = 47757d0fa935c637e6e8c7bd65d8741748fcc5e8
          export GIT_AUTHOR_NAME='GTA STEM Review' GIT_AUTHOR_EMAIL='review@example.invalid'
          export GIT_COMMITTER_NAME='GTA STEM Review' GIT_COMMITTER_EMAIL='review@example.invalid'
          export GIT_AUTHOR_DATE='2026-11-10T06:00:00Z' GIT_COMMITTER_DATE='2026-11-10T06:00:00Z'
          candidate="$(git commit-tree "$(git write-tree)" -p ab3674f84b89c8603d39cda1edc2b5e5aff5bcf0 -m 'Review mobile sort and matching native translations')"
          test "$candidate" = "$APP_COMMIT"
          git reset --hard "$candidate"
          sha256sum -c <<'SHAS'
          b1bc634cf7be59ac0ecf0799f717f0726660978f2356e51d57fc55848635fc9b  public/opportunities.json
          e5d3293c493ef8bc11cebe753916e0ff2477b829b9ed1c53a59258d72873338e  public/opportunities-v2.json
          a6f57f274200299e83d49c91481f888a5d51b21c44858204cd47cdef4d701226  lib/generatedLibraryOpportunities.ts
          1d49e0d2b9a2940aa6b08b0e46aca8b7933197c3fc70f4c405101f302234a11b  lib/generatedDiscoveryReview.ts
          f513f9ac3fb894f16a15450efb95280178a4211abc111fa4407305767134fe8e  schemas/accessibility-support-v1.schema.json
          SHAS
      - name: Verify checkout and exclude temporary QA routes
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$APP_COMMIT"
          test ! -e app/__frontend-qa
      - name: Set up Node without a persistent cache
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Install locked dependencies
        run: npm ci
      - name: Run scoped accessibility and saved-filter tests
        run: ./node_modules/.bin/tsx --test --test-concurrency=1 lib/accessibilitySupport.test.ts lib/scopedPresets/criteria.test.ts lib/scopedPresets/repository.test.ts lib/scopedPresets/controlRendering.test.tsx lib/scopedPresets/localOnlyUrl.test.ts lib/highSchool/presetTransition.test.ts lib/highSchool/roleConsumer.test.tsx lib/youthHunter/client.freshness.test.ts
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Check source contracts
        run: npm run qa
      - name: Build the reviewed static website
        run: npm run build:github-pages
        env:
          GTA_SOURCE_COMMIT: dbd498d4cf62d26ef07f34697268c35fe32b192a
      - name: Confirm the preview cannot target production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request
          request = urllib.request.Request(
              'https://api.cloudflare.com/client/v4/accounts/780712be4fc9ab0b0fc581c09735a77b/pages/projects/gta-free-stem',
              headers={'Authorization': 'Bearer ' + os.environ['CLOUDFLARE_API_TOKEN']})
          with urllib.request.urlopen(request, timeout=30) as response:
              project = json.load(response)
          assert project['success']
          assert project['result']['production_branch'] == 'main'
          assert os.environ['PREVIEW_BRANCH'] != 'main'
          print('Verified: the review deployment is a non-production branch.')
          PY
      - name: Deploy only the non-indexed review branch
        run: |
          set -euo pipefail
          npx --yes wrangler@4.152.0 pages deploy out --project-name=gta-free-stem --branch="$PREVIEW_BRANCH" --commit-hash="$APP_COMMIT" | tee "$RUNNER_TEMP/gta-preview-deploy.log"
          python3 - <<'PYURL'
          import json,os,re
          from pathlib import Path
          raw=(Path(os.environ['RUNNER_TEMP'])/'gta-preview-deploy.log').read_text()
          urls=set(re.findall(r'https://[a-f0-9]{8,}\.gta-free-stem\.pages\.dev',raw))
          assert len(urls)==1,urls
          url=next(iter(urls))
          with open(os.environ['GITHUB_ENV'],'a') as output:
              output.write('GTA_PREVIEW_IMMUTABLE_URL='+url+'\n')
          print(json.dumps({'immutablePreviewUrl':url,'sourceCommit':os.environ['APP_COMMIT'],'productionDeployment':False}))
          PYURL
        env:
          CLOUDFLARE_ACCOUNT_ID: 780712be4fc9ab0b0fc581c09735a77b
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          WRANGLER_SEND_METRICS: 'false'
      - name: Verify immutable preview source, native data and indexing protection
        run: python3 "$GITHUB_WORKSPACE/preview-ops/.github/gta-visual/verify-preview.py" "$GTA_PREVIEW_IMMUTABLE_URL" "$APP_COMMIT" "$EXPECTED_NATIVE_FEED_SHA256"

