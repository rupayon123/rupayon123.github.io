name: Check current GTA frontend visuals
on:
  push:
    branches: [codex/frontend-preview-20261110]
    paths: [.github/workflows/publish.yml]
permissions:
  contents: read
concurrency:
  group: gta-reviewed-preview
  cancel-in-progress: false
jobs:
  visuals:
    if: github.repository == 'rupayon123/rupayon123.github.io' && github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GTA_QA_BASE_URL: https://d72b3c28.gta-free-stem.pages.dev
      GTA_QA_SOURCE_COMMIT: b20d7b83327a31252d2fe15cfe35f331e962a243
      GTA_QA_NATIVE_SHA256: d7c990ac47516423815199ab04026cd636b64be67c95cad01992838f1c59d004
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      PUPPETEER_SKIP_DOWNLOAD: 'true'
      NODE_OPTIONS: --max-old-space-size=512
      NEXT_TELEMETRY_DISABLED: '1'
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - name: Require the one reviewed source revision
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = push
          test "$GITHUB_REF_NAME" = codex/frontend-preview-20261110
          test "${{ github.event.before }}" = 8864b93b14e33d161332e5d7f5d399419928a94a
      - name: Check out the exact QA source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up existing Node without persistent caches
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Install only the reviewed locked browser-test dependencies
        working-directory: .github/gta-visual
        run: npm ci --ignore-scripts --no-audit --no-fund
        env:
          NPM_CONFIG_CACHE: ${{ runner.temp }}/gta-visual-npm-cache
      - name: Ensure real Japanese glyph coverage before screenshot checks
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk
          python3 - <<'PYFONT'
          import subprocess
          for code in [0x63A2,0x7A76]:
              charset=subprocess.check_output(['fc-match','-f','%{charset}',':charset='+format(code,'x')],text=True)
              ranges=[part.split('-') for part in charset.split()]
              assert any(int(r[0],16)<=code<=int(r[-1],16) for r in ranges),'Missing actual Japanese glyph coverage'
          print('Verified Japanese test label glyphs are present in runner fonts.')
          PYFONT
      - name: Verify immutable preview source before opening a browser
        run: python3 .github/gta-visual/verify-preview.py "$GTA_QA_BASE_URL" "$GTA_QA_SOURCE_COMMIT" "$GTA_QA_NATIVE_SHA256"
      - name: Run the eight guarded browser scenes sequentially
        id: browser
        continue-on-error: true
        run: python3 .github/gta-visual/run-all-scenes.py
      - name: Allow only released, sanitized original evidence
        if: always() && steps.browser.outcome != 'skipped'
        id: evidence
        run: |
          python3 - <<'PYSAFE'
          import json,os
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP'])/'gta-all-visual-evidence'
          manifest=json.loads((root/'evidence.json').read_text())
          assert manifest['safeToPublishEvidence'],'All browser processes must be released before account credentials are used'
          assert manifest['appSourceCommit']==os.environ['GTA_QA_SOURCE_COMMIT']
          assert manifest['nativeFeedSha256']==os.environ['GTA_QA_NATIVE_SHA256']
          files=[p for p in root.rglob('*') if p.is_file()]
          assert len(files)<=1000 and all(not p.is_symlink() for p in root.rglob('*'))
          assert all(p.suffix in ['.png','.json'] or p.name in ['_headers','robots.txt'] for p in files)
          with open(os.environ['GITHUB_OUTPUT'],'a') as output:output.write('publish=true\n')
          print(json.dumps({'releasedAndSanitized':True,'files':len(files),'browserChecksPassed':manifest['browserChecksPassed'],'visualAcceptance':False}))
          PYSAFE
      - name: Verify the existing evidence-only Cloudflare destination
        if: always() && steps.evidence.outputs.publish == 'true'
        id: destination
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          python3 - <<'PYDEST'
          import json,os,urllib.request
          request=urllib.request.Request('https://api.cloudflare.com/client/v4/accounts/780712be4fc9ab0b0fc581c09735a77b/pages/projects/gta-free-stem',headers={'Authorization':'Bearer '+os.environ['CLOUDFLARE_API_TOKEN']})
          with urllib.request.urlopen(request,timeout=30) as response:result=json.load(response)
          assert result['success'] and result['result']['name']=='gta-free-stem' and result['result']['production_branch']=='main'
          print('Verified existing project; only the separate evidence preview will be deployed.')
          PYDEST
      - name: Publish original PNGs and metadata to the separate evidence preview
        if: always() && steps.destination.outcome == 'success'
        env:
          CLOUDFLARE_ACCOUNT_ID: 780712be4fc9ab0b0fc581c09735a77b
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          NPM_CONFIG_CACHE: ${{ runner.temp }}/gta-evidence-npm-cache
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/gta-clean-evidence-deploy"
          cd "$RUNNER_TEMP/gta-clean-evidence-deploy"
          test ! -e wrangler.toml
          test ! -e functions
          npx --yes wrangler@4.152.0 pages deploy "$RUNNER_TEMP/gta-all-visual-evidence" --project-name=gta-free-stem --branch=review-evidence-20261110 --commit-hash="$GTA_QA_SOURCE_COMMIT" | tee "$RUNNER_TEMP/gta-evidence-deploy.log"
          python3 - <<'PYURL'
          import json,os,re,subprocess
          from pathlib import Path
          raw=(Path(os.environ['RUNNER_TEMP'])/'gta-evidence-deploy.log').read_text()
          urls=set(re.findall(r'https://[a-f0-9]{8,}\.gta-free-stem\.pages\.dev',raw));assert len(urls)==1
          url=next(iter(urls))
          response=subprocess.run(['curl','--fail','--silent','--show-error','--max-time','30',url+'/evidence.json'],check=True,capture_output=True,text=True)
          result=json.loads(response.stdout)
          assert result['appSourceCommit']==os.environ['GTA_QA_SOURCE_COMMIT'] and result['nativeFeedSha256']==os.environ['GTA_QA_NATIVE_SHA256']
          print(json.dumps({'originalEvidenceUrl':url,'browserChecksPassed':result['browserChecksPassed'],'visualAcceptance':False,'scenesExecuted':result['scenesExecuted']}))
          PYURL
      - name: Keep failures visible and require original screenshot review
        if: always()
        run: |
          python3 - <<'PYGATE'
          import json,os
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP'])/'gta-all-visual-evidence'
          receipt=json.loads((root/'evidence.json').read_text())
          assert receipt['expectedScenes']==receipt['scenesExecuted']==8
          assert receipt['browserChecksPassed'] and receipt['safeToPublishEvidence']
          assert receipt['appSourceCommit']==os.environ['GTA_QA_SOURCE_COMMIT']
          assert receipt['nativeFeedSha256']==os.environ['GTA_QA_NATIVE_SHA256']
          for scene in receipt['scenes']:
              detail=json.loads((root/scene['manifest']).read_text())
              assert scene['testStatus']==detail['testStatus']=='passed'
              assert detail['resource']['releaseConfirmed']
          print('All 8 scene receipts passed; zero unrun; browser cleanup confirmed.')
          PYGATE
          echo 'Browser checks passed. Original PNG inspection is still required; no production release is implied.'
