name: Preview reviewed GTA website

# This branch-only replacement of the existing registered publish workflow is
# manually dispatched. It never deploys the main branch or GitHub Pages.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gta-reviewed-preview
  cancel-in-progress: false

jobs:
  preview:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      APP_COMMIT: 4284a92af37876e8158b0d3fdd95045427cd3f7f
      EXPECTED_NATIVE_FEED_SHA256: 07c1eafc85931f9a44f926242f8377680c569191d04928223780e861e70d101e
      PREVIEW_BRANCH: review-accessibility
      NEXT_TELEMETRY_DISABLED: '1'
      NODE_OPTIONS: --max-old-space-size=2048
    steps:
      - name: Require an immutable reviewed source
        shell: bash
        run: |
          set -euo pipefail
          [[ "$APP_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          test "$PREVIEW_BRANCH" != main
      - name: Check out reviewed application source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: rupayon123/gta-free-stem-opportunities
          ref: 4284a92af37876e8158b0d3fdd95045427cd3f7f
          persist-credentials: false
      - name: Verify checkout and exclude temporary QA routes
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$APP_COMMIT"
          test ! -e app/__frontend-qa
      - name: Set up Node without a persistent cache
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Install locked dependencies
        run: npm ci
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Check source contracts
        run: npm run qa
      - name: Build the reviewed static website
        run: npm run build:github-pages
        env:
          GTA_SOURCE_COMMIT: 4284a92af37876e8158b0d3fdd95045427cd3f7f
      - name: Confirm the preview cannot target production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request
          request = urllib.request.Request(
              'https://api.cloudflare.com/client/v4/accounts/780712be4fc9ab0b0fc581c09735a77b/pages/projects/gta-free-stem',
              headers={'Authorization': 'Bearer ' + os.environ['CLOUDFLARE_API_TOKEN']})
          with urllib.request.urlopen(request, timeout=30) as response:
              project = json.load(response)
          assert project['success']
          assert project['result']['production_branch'] == 'main'
          assert os.environ['PREVIEW_BRANCH'] != 'main'
          print('Verified: the review deployment is a non-production branch.')
          PY
      - name: Deploy only the non-indexed review branch
        run: npx --yes wrangler@4.152.0 pages deploy out --project-name=gta-free-stem --branch=review-accessibility --commit-hash="$APP_COMMIT"
        env:
          CLOUDFLARE_ACCOUNT_ID: 780712be4fc9ab0b0fc581c09735a77b
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          WRANGLER_SEND_METRICS: 'false'
      - name: Verify preview source and indexing protection
        run: |
          python3 - <<'PY'
          import json, os, time, urllib.request
          base = 'https://review-accessibility.gta-free-stem.pages.dev'
          headers = {'User-Agent': 'GTA-Free-STEM-Release-Check/1.0'}
          for attempt in range(6):
              try:
                  with urllib.request.urlopen(urllib.request.Request(base + '/', headers=headers), timeout=30) as response:
                      assert 'noindex' in response.headers.get('X-Robots-Tag', '').lower()
                  with urllib.request.urlopen(urllib.request.Request(base + '/hosting-release.json', headers=headers), timeout=30) as response:
                      release = json.load(response)
                  assert release['sourceCommit'] == os.environ['APP_COMMIT']
                  assert release['nativeFeedSha256'] == os.environ['EXPECTED_NATIVE_FEED_SHA256']
                  break
              except Exception:
                  if attempt == 5:
                      raise
                  time.sleep(5)
          print(json.dumps({'previewUrl': base, 'sourceCommit': release['sourceCommit'], 'searchIndexing': 'noindex', 'productionDeployment': False}))
          PY
