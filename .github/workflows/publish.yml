name: Preview current GTA frontend

# Isolated review deployment; no production or GitHub Pages publication.
on:
  push:
    branches: [codex/frontend-preview-20261110]
    paths: [.github/workflows/publish.yml]

permissions:
  contents: read

concurrency:
  group: gta-reviewed-preview
  cancel-in-progress: false

jobs:
  preview:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: app-source
    env:
      APP_COMMIT: b20d7b83327a31252d2fe15cfe35f331e962a243
      EXPECTED_NATIVE_FEED_SHA256: d7c990ac47516423815199ab04026cd636b64be67c95cad01992838f1c59d004
      PREVIEW_BRANCH: review-frontend-20261110
      NEXT_TELEMETRY_DISABLED: '1'
      NODE_OPTIONS: --max-old-space-size=2048
    steps:
      - name: Require an immutable reviewed source
        working-directory: ${{ github.workspace }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = push
          test "$GITHUB_REF_NAME" = codex/frontend-preview-20261110
          test "${{ github.event.before }}" = 8730a6a2460f18a7677f0a23290d130d08eb50e7
          [[ "$APP_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          test "$PREVIEW_BRANCH" != main
      - name: Check out the exact preview verification source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          path: preview-ops
          persist-credentials: false
      - name: Check out reviewed application source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: rupayon123/gta-free-stem-opportunities
          path: app-source
          ref: b20d7b83327a31252d2fe15cfe35f331e962a243
          persist-credentials: false
      - name: Verify checkout and exclude temporary QA routes
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$APP_COMMIT"
          test ! -e app/__frontend-qa
      - name: Set up Node without a persistent cache
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Install locked dependencies
        run: npm ci
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Check source contracts
        run: npm run qa
      - name: Build the reviewed static website
        run: npm run build:github-pages
        env:
          GTA_SOURCE_COMMIT: b20d7b83327a31252d2fe15cfe35f331e962a243
      - name: Confirm the preview cannot target production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request
          request = urllib.request.Request(
              'https://api.cloudflare.com/client/v4/accounts/780712be4fc9ab0b0fc581c09735a77b/pages/projects/gta-free-stem',
              headers={'Authorization': 'Bearer ' + os.environ['CLOUDFLARE_API_TOKEN']})
          with urllib.request.urlopen(request, timeout=30) as response:
              project = json.load(response)
          assert project['success']
          assert project['result']['production_branch'] == 'main'
          assert os.environ['PREVIEW_BRANCH'] != 'main'
          print('Verified: the review deployment is a non-production branch.')
          PY
      - name: Deploy only the non-indexed review branch
        run: |
          set -euo pipefail
          npx --yes wrangler@4.152.0 pages deploy out --project-name=gta-free-stem --branch="$PREVIEW_BRANCH" --commit-hash="$APP_COMMIT" | tee "$RUNNER_TEMP/gta-preview-deploy.log"
          python3 - <<'PYURL'
          import json,os,re
          from pathlib import Path
          raw=(Path(os.environ['RUNNER_TEMP'])/'gta-preview-deploy.log').read_text()
          urls=set(re.findall(r'https://[a-f0-9]{8,}\.gta-free-stem\.pages\.dev',raw))
          assert len(urls)==1,urls
          url=next(iter(urls))
          with open(os.environ['GITHUB_ENV'],'a') as output:
              output.write('GTA_PREVIEW_IMMUTABLE_URL='+url+'\n')
          print(json.dumps({'immutablePreviewUrl':url,'sourceCommit':os.environ['APP_COMMIT'],'productionDeployment':False}))
          PYURL
        env:
          CLOUDFLARE_ACCOUNT_ID: 780712be4fc9ab0b0fc581c09735a77b
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          WRANGLER_SEND_METRICS: 'false'
      - name: Verify immutable preview source, native data and indexing protection
        run: python3 "$GITHUB_WORKSPACE/preview-ops/.github/gta-visual/verify-preview.py" "$GTA_PREVIEW_IMMUTABLE_URL" "$APP_COMMIT" "$EXPECTED_NATIVE_FEED_SHA256"

