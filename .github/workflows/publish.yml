name: Review Hub dark browser evidence
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: gta-hub-dark-browser-evidence
  cancel-in-progress: false
jobs:
  hub-dark:
    if: github.repository == 'rupayon123/rupayon123.github.io' && github.event.repository.private == false && github.ref_name == 'codex/browser-evidence-hub-dark-20261030'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      APP_COMMIT: 9f83e87e4447b805373ff9f7f206adb737e5c413
      EVIDENCE_BRANCH: review-evidence
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      PUPPETEER_SKIP_DOWNLOAD: 'true'
      NODE_OPTIONS: --max-old-space-size=512
      NEXT_TELEMETRY_DISABLED: '1'
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - name: Check out only the reviewed evidence workflow branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Verify source packet and preview-only destination
        working-directory: .github/gta-evidence
        shell: bash
        run: |
          set -euo pipefail
          test "$EVIDENCE_BRANCH" = review-evidence
          test "$EVIDENCE_BRANCH" != main
          test "$EVIDENCE_BRANCH" != review-accessibility
          test -x /usr/bin/google-chrome
          sha256sum --check <<'HASHES'
          3888d1ff3f3750519eda4d45155918cae7c8bbbc21138de5a0413b093530e445  run-hub-dark.cjs
          7740c9328b5df015514fbde199df04123b50c46220092e91de64e6c4782acbd6  run-linux-guard.py
          6dfd8a7b2a0b961f43beb72aee57257170e8508c03eea9320e442cab6f1573d8  sanitize-evidence.py
          de4f8389d706f7a883ae0b1ae89fcef737b81d6180de1b2f89bfa29eb6c9752b  package.json
          6555d517e288f9cee7472e19f432db248f9c6b43673f90e25da43d4236725032  package-lock.json
          HASHES
      - name: Select Node without a persistent cache
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Install only the existing locked QA dependencies without scripts or browsers
        working-directory: .github/gta-evidence
        env:
          NPM_CONFIG_CACHE: ${{ runner.temp }}/gta-evidence-npm-cache
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Run exactly one guarded Hub-dark scene
        id: browser
        working-directory: .github/gta-evidence
        continue-on-error: true
        run: python3 run-linux-guard.py
      - name: Prepare only sanitized original screenshots and the small public manifest
        if: always() && steps.browser.outcome != 'skipped'
        id: sanitize
        working-directory: .github/gta-evidence
        run: python3 sanitize-evidence.py
      - name: Verify the existing project and separate preview destination
        if: always() && steps.sanitize.outcome == 'success'
        id: destination
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request
          assert os.environ['EVIDENCE_BRANCH'] == 'review-evidence'
          assert os.environ['EVIDENCE_BRANCH'] not in ['main','review-accessibility']
          request=urllib.request.Request('https://api.cloudflare.com/client/v4/accounts/780712be4fc9ab0b0fc581c09735a77b/pages/projects/gta-free-stem',headers={'Authorization':'Bearer '+os.environ['CLOUDFLARE_API_TOKEN']})
          with urllib.request.urlopen(request,timeout=30) as response:project=json.load(response)
          assert project['success'] and project['result']['name']=='gta-free-stem'
          assert project['result']['production_branch']=='main'
          print('Existing project confirmed; evidence branch cannot target the app preview or production.')
          PY
      - name: Deploy only sanitized evidence to the separate non-indexed preview
        if: always() && steps.destination.outcome == 'success'
        id: deploy
        env:
          NPM_CONFIG_CACHE: ${{ runner.temp }}/gta-evidence-npm-cache
          CLOUDFLARE_ACCOUNT_ID: 780712be4fc9ab0b0fc581c09735a77b
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/gta-evidence-clean-deploy"
          cd "$RUNNER_TEMP/gta-evidence-clean-deploy"
          test ! -e wrangler.toml
          test ! -e functions
          npx --yes wrangler@4.152.0 pages deploy "$RUNNER_TEMP/gta-public-evidence" --project-name=gta-free-stem --branch=review-evidence --commit-hash="$APP_COMMIT"
      - name: Verify public evidence indexing, exact app source and original PNG bytes
        if: always() && steps.deploy.outcome == 'success'
        run: |
          python3 - <<'PY'
          import hashlib,json,os,urllib.request
          base='https://review-evidence.gta-free-stem.pages.dev/'
          with urllib.request.urlopen(base+'evidence.json',timeout=30) as response:
              assert 'noindex' in response.headers.get('X-Robots-Tag','').lower()
              manifest=json.load(response)
          assert manifest['appSourceCommit']==os.environ['APP_COMMIT']
          assert manifest['visualAcceptance'] is False
          for image in manifest['screenshots']:
              with urllib.request.urlopen(base+image['file'],timeout=30) as response:
                  assert 'noindex' in response.headers.get('X-Robots-Tag','').lower()
                  assert hashlib.sha256(response.read()).hexdigest()==image['sha256']
          print(json.dumps({'evidenceManifest':base+'evidence.json','sourceCommit':manifest['appSourceCommit'],'imageCount':len(manifest['screenshots']),'testStatus':manifest['testStatus'],'visualAcceptance':False}))
          PY
      - name: Preserve the first test failure as the job result
        if: always()
        run: |
          test '${{ steps.browser.outcome }}' = success
          test '${{ steps.sanitize.outcome }}' = success
          test '${{ steps.deploy.outcome }}' = success
      - name: Remove only disposable evidence, profiles and caches from this VM
        if: always()
        run: |
          python3 - <<'PY'
          import os,shutil
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP'])
          for name in ['gta-hub-dark-evidence','gta-public-evidence','gta-evidence-clean-deploy','gta-evidence-npm-cache']:
              target=root/name
              if target.exists():shutil.rmtree(target)
          PY
